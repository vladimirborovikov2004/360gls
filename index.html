<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Тест</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <style>* {margin:0;padding:0;}html,body{height:100vh;overflow:hidden;background:black;}#panorama{width:100%;height:100vh;}</style>
</head>
<body>
    <div id="panorama"></div>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        pannellum.viewer('panorama', {
            type: 'equirectangular',
            panorama: 'https://raw.githubusercontent.com/mpetroff/pannellum/master/examples/img/lyon.jpg',
            autoLoad: true,
            showControls: false,
            mouseZoom: false
        });
    </script>
</body>
</html>
